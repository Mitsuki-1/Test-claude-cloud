name: Deploy site to GitHub Pages

on:
  push:
    branches: ["claude/caramell-kids-clothing-site-yn073j", "main"]
  schedule:
    - cron: "17 * * * *"  # раз в час; GitHub запускает расписание только на ветке по умолчанию
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ролики «Смотрите вживую» не хранятся в git (чтобы не раздувать историю) — переносим их между запусками кэшем
      - uses: actions/cache@v4
        with:
          path: assets/reels
          key: reels-${{ github.run_id }}
          restore-keys: reels-

      - name: Установить ffmpeg (сжатие роликов и выбор кадров)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - name: Видео, кадры и фото из Telegram
        run: python scripts/sync_telegram.py
        continue-on-error: true

      - name: Каталог из BILLZ (пропускается, если секрета нет)
        run: python scripts/sync_billz.py
        continue-on-error: true
        env:
          BILLZ_SECRET_TOKEN: ${{ secrets.BILLZ_SECRET_TOKEN }}
          BILLZ_SHOP_IDS: ${{ vars.BILLZ_SHOP_IDS }}

      - name: Сохранить обновлённые данные в ветку
        run: |
          git add -A assets/tg js/data
          if git diff --cached --quiet; then
            echo "Данные не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Синхронизация каталога и фото [skip ci]"
          # Если параллельный запуск уже сохранил свои данные — не падаем: сайт всё равно выкладывается,
          # а в ветку свежие данные попадут при следующем запуске через час
          if git pull --rebase origin "$GITHUB_REF_NAME"; then
            git push origin "HEAD:$GITHUB_REF_NAME" || echo "::warning::Не удалось сохранить данные в ветку — сохранятся при следующем запуске"
          else
            git rebase --abort
            echo "::warning::Ветка изменилась параллельно — данные сохранятся при следующем запуске"
          fi

      # Версии к css/js в HTML (?v=<хэш>), чтобы после обновления браузеры и кэш хостинга не держали старые стили.
      # Делается только в выкладываемой копии — в ветку не коммитится.
      - name: Версии файлов для сброса кэша
        run: python scripts/stamp_assets.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # Основной хостинг — AIRNET (cPanel, Ташкент). Выкладываются только изменившиеся файлы.
      # Шаг пропускается, пока в Settings → Secrets нет FTP_SERVER / FTP_USERNAME / FTP_PASSWORD.
      - name: Выложить на хостинг AIRNET (FTP)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ vars.FTP_DIR || './' }}  # FTP-аккаунт создаётся сразу с папкой public_html
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            **/__pycache__/**
            **/*.part
            README.md
            assets/README.md
